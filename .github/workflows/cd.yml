name: CD

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binary:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: make package

      - uses: actions/upload-artifact@v5
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/timba-*.tar.gz
            dist/timba-*.sha256

  build-docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build and push Docker image
        run: |
          make docker
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REPO="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          docker tag timba:ci ${REPO}:${TAG}
          docker push ${REPO}:${TAG}
          docker tag timba:ci ${REPO}:latest
          docker push ${REPO}:latest

  release:
    name: Release
    needs: [build-binary, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --generate-notes \
            artifacts/timba-*.tar.gz \
            artifacts/timba-*.sha256 \
          || echo "Release already exists — uploading assets"

          for f in artifacts/timba-*; do
            gh release upload "$VERSION" "$f" --clobber 2>/dev/null || true
          done
