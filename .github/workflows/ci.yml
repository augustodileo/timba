name: CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Check for leaked secrets
        run: .github/hooks/pre-commit all

      - name: Lint + SAST
        run: make lint

      - name: Audit dependencies
        run: uv run pip-audit --skip-editable

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: make test

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build Docker image
        run: make docker

      - name: Smoke test
        run: docker run --rm timba:ci --version

      - name: Container structure test
        run: |
          docker run --rm --entrypoint "" timba:ci sh -c '
            test -f /app/timba &&
            test -f /app/config.yaml &&
            whoami | grep -q bot &&
            echo "Structure tests passed"
          '

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: timba:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
