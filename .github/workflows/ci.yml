name: CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: make lint
      - run: make audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: make test

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: make docker

      - name: Get image ref
        id: image
        run: echo "ref=$(make docker-image)" >> "$GITHUB_OUTPUT"

      - run: make docker-test

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: 1
          severity: CRITICAL
          trivyignores: ""

      - name: Full vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM

      - name: Container best practices (Dockle)
        uses: erzz/dockle-action@v1
        with:
          image: ${{ steps.image.outputs.ref }}
          exit-code: 1
          failure-threshold: WARN
          accept-keywords: DKL-DI-0005
